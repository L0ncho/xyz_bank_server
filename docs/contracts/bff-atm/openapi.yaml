openapi: 3.0.3
info:
  title: bff-atm
  description: >
    ATM channel backend-for-frontend. Exposes balance inquiry and cash
    withdrawal only. Forwards the terminal Idempotency-Key unchanged so a
    reconnect after commit replays the original core-service result. Authenticates
    with JWT Bearer HS256 over HTTPS. X-Terminal-Id must match the JWT terminalId
    claim. Does not access any database and does not expose history, profile, or
    admin operations. Identity headers (X-Customer-Id, X-Channel) are ignored.
  version: "1.0.0"
servers:
  - url: https://localhost:8083
security:
  - bearerAuth: []
paths:
  /accounts/{accountId}/balance:
    get:
      summary: Balance inquiry
      operationId: getBalance
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/XTerminalId'
      responses:
        '200':
          description: Current balance and currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /accounts/{accountId}/withdrawals:
    post:
      summary: Cash withdrawal
      operationId: withdraw
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/XTerminalId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalRequest'
      responses:
        '201':
          description: >
            Withdrawal succeeded, or a retry with the same Idempotency-Key
            after a lost connection replayed the originally committed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: core-service conflict relayed unchanged
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HS256 JWT. Claims: sub (customer id), channel=atm, roles=[ROLE_ATM],
        terminalId (required), iss=xyz-bank, exp.
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    XTerminalId:
      name: X-Terminal-Id
      in: header
      required: true
      schema:
        type: string
      description: Must match the JWT terminalId claim exactly
  responses:
    Unauthorized:
      description: Missing, expired, or invalid Bearer token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: >
        Caller channel or role is not atm, or X-Terminal-Id does not match
        the JWT terminalId claim
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Unknown account
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: Missing Idempotency-Key or invalid withdrawal request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: core-service responded 5xx
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    GatewayTimeout:
      description: core-service did not respond within the BFF timeout
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    BalanceResponse:
      type: object
      required: [accountId, balance, currency]
      additionalProperties: false
      properties:
        accountId:
          type: string
        balance:
          type: number
        currency:
          type: string
    WithdrawalRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
        currency:
          type: string
    WithdrawalResponse:
      type: object
      required: [transactionId, accountId, amount, currency, occurredOn, newBalance]
      properties:
        transactionId:
          type: string
        accountId:
          type: string
        amount:
          type: number
        currency:
          type: string
        occurredOn:
          type: string
          format: date
        newBalance:
          type: number
    ProblemDetail:
      type: object
      required: [title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
