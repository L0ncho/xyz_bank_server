openapi: 3.0.3
info:
  title: bff-atm
  description: >
    ATM channel backend-for-frontend. Exposes PIN verification, balance
    inquiry, and cash withdrawal only. Forwards the terminal Idempotency-Key
    unchanged so a reconnect after commit replays the original core-service
    result. Does not access any database and does not expose history,
    profile, or admin operations.

    Every request, including PIN verification, must present the ATM
    terminal's mTLS client certificate (server.ssl.client-auth: need on this
    service's connector) -- OpenAPI 3.0 has no native way to declare that
    requirement, so it is documented here rather than as a securityScheme.
    The two domain endpoints additionally require the 120-second ATM session
    bearer token obtained from /pin-verifications, bound to that same
    terminal certificate.
  version: "1.0.0"
servers:
  - url: https://localhost:8083
security:
  - SessionBearer: []
paths:
  /pin-verifications:
    post:
      summary: Verify a card PIN and obtain a 120-second session
      description: >
        Pre-auth endpoint: requires the terminal's mTLS certificate but no
        session bearer token yet -- that is what this call produces. The PIN
        is accepted only in the request body, never a query parameter. A
        locked card and an incorrect PIN are surfaced as distinct outcomes;
        an unknown card is rejected identically to an incorrect PIN
        (no card-existence oracle). No response body, log line, or error
        message ever echoes the submitted PIN.
      operationId: verifyPin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinVerificationRequest'
      responses:
        '200':
          description: Correct PIN; a session bound to this terminal is issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtmSessionResponse'
        '401':
          description: Incorrect PIN or unknown card (indistinguishable); no session issued
        '423':
          description: Card is locked (third consecutive failure, or already locked); no session issued
  /accounts/{accountId}/balance:
    get:
      summary: Balance inquiry
      operationId: getBalance
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Current balance and currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /accounts/{accountId}/withdrawals:
    post:
      summary: Cash withdrawal
      operationId: withdraw
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalRequest'
      responses:
        '201':
          description: >
            Withdrawal succeeded, or a retry with the same Idempotency-Key
            after a lost connection replayed the originally committed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: core-service conflict relayed unchanged
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    SessionBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HS256 JWT issued by /pin-verifications, bound to the terminal's mTLS
        certificate and capped at 120 seconds. Rejected if presented over a
        connection authenticated with a different terminal certificate than
        the one it was bound to.
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
  responses:
    Forbidden:
      description: Caller channel is not atm
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Unknown account
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: >
        Missing bearer token, a session bound to a different terminal than
        the one presenting it, missing Idempotency-Key, or an invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    PinVerificationRequest:
      type: object
      required: [cardNumber, pin]
      properties:
        cardNumber:
          type: string
        pin:
          type: string
    AtmSessionResponse:
      type: object
      required: [sessionToken]
      properties:
        sessionToken:
          type: string
    BalanceResponse:
      type: object
      required: [balance, currency]
      properties:
        balance:
          type: number
        currency:
          type: string
    WithdrawalRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
        currency:
          type: string
    WithdrawalResponse:
      type: object
      required: [transactionId, accountId, amount, currency, occurredOn, newBalance]
      properties:
        transactionId:
          type: string
        accountId:
          type: string
        amount:
          type: number
        currency:
          type: string
        occurredOn:
          type: string
          format: date
        newBalance:
          type: number
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
