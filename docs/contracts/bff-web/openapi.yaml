openapi: 3.0.3
info:
  title: bff-web
  description: >
    Web channel backend-for-frontend. Aggregates core-service data into full
    payloads for the dashboard, filterable transaction history, and annual
    interest view. Authenticates with JWT Bearer HS256 over HTTPS. Does not
    access any database. Identity headers (X-Customer-Id, X-Channel) are ignored.
  version: "1.0.0"
servers:
  - url: https://localhost:8081
security:
  - bearerAuth: []
paths:
  /customers/{customerId}/dashboard:
    get:
      summary: Dashboard aggregate
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Profile, every account with balance, latest transactions, and annual interest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /accounts/{accountId}/transactions:
    get:
      summary: Full transaction history
      operationId: getTransactionHistory
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: type
          in: query
          schema:
            type: string
            enum: [DEBIT, CREDIT]
        - name: cursor
          in: query
          schema:
            type: string
        - name: pageSize
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: A page of filtered transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /accounts/{accountId}/interest-summary:
    get:
      summary: Annual interest view
      operationId: getInterestView
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Annual interest summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestViewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HS256 JWT. Claims: sub (customer id), channel=web, roles=[ROLE_WEB],
        iss=xyz-bank, exp.
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing, expired, or invalid Bearer token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Caller channel or role is not web
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: No resource matches the given identifier
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: Invalid request filter
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: core-service responded 5xx
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    GatewayTimeout:
      description: core-service did not respond within the BFF timeout
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    DashboardResponse:
      type: object
      required: [profile, accounts]
      properties:
        profile:
          $ref: '#/components/schemas/CustomerProfile'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountSummary'
    CustomerProfile:
      type: object
      required: [id, fullName, email]
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
    AccountSummary:
      type: object
      required: [id, accountNumber, balance, currency, transactions, interest]
      properties:
        id:
          type: string
        accountNumber:
          type: string
        balance:
          type: number
        currency:
          type: string
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/RecentTransaction'
        interest:
          $ref: '#/components/schemas/InterestViewResponse'
    RecentTransaction:
      type: object
      required: [id, type, amount, currency, occurredOn]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          type: number
        currency:
          type: string
        occurredOn:
          type: string
          format: date
        description:
          type: string
          nullable: true
    TransactionHistoryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecentTransaction'
        nextCursor:
          type: string
          nullable: true
    InterestViewResponse:
      type: object
      required: [accountId, year, openingBalance, closingBalance, interestRate, interestAmount, currency]
      properties:
        accountId:
          type: string
        year:
          type: integer
        openingBalance:
          type: number
        closingBalance:
          type: number
        interestRate:
          type: number
        interestAmount:
          type: number
        currency:
          type: string
    ProblemDetail:
      type: object
      required: [title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
