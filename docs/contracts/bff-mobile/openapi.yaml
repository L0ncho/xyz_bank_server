openapi: 3.0.3
info:
  title: bff-mobile
  description: >
    Mobile channel backend-for-frontend. Returns an ultra-light, flattened
    account summary (accountId, balance, currency) with no transaction history.
    Does not access any database.
  version: "1.0.0"
servers:
  - url: http://localhost:8082
paths:
  /accounts/{accountId}/summary:
    get:
      summary: Account summary
      operationId: getAccountSummary
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: X-Customer-Id
          in: header
          required: true
          schema:
            type: string
        - name: X-Channel
          in: header
          required: true
          schema:
            type: string
            enum: [mobile]
      responses:
        '200':
          description: Flat accountId, balance, and currency only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryResponse'
        '403':
          description: Caller channel is not mobile
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Unknown account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Missing or invalid caller identity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  schemas:
    AccountSummaryResponse:
      type: object
      required: [accountId, balance, currency]
      additionalProperties: false
      properties:
        accountId:
          type: string
        balance:
          type: number
        currency:
          type: string
    ProblemDetail:
      type: object
      required: [title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
