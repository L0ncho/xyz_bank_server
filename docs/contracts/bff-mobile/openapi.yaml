openapi: 3.0.3
info:
  title: bff-mobile
  description: >
    Mobile channel backend-for-frontend. Returns an ultra-light, flattened
    account summary (accountId, balance, currency) with no transaction history.
    Authenticates with JWT Bearer HS256 over HTTPS. Does not access any database.
    Identity headers (X-Customer-Id, X-Channel) are ignored.
  version: "1.0.0"
servers:
  - url: https://localhost:8082
security:
  - bearerAuth: []
paths:
  /accounts/{accountId}/summary:
    get:
      summary: Account summary
      operationId: getAccountSummary
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Flat accountId, balance, and currency only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HS256 JWT. Claims: sub (customer id), channel=mobile, roles=[ROLE_MOBILE],
        iss=xyz-bank, exp.
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing, expired, or invalid Bearer token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Caller channel or role is not mobile
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Unknown account
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: core-service responded 5xx
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    GatewayTimeout:
      description: core-service did not respond within the BFF timeout
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    AccountSummaryResponse:
      type: object
      required: [accountId, balance, currency]
      additionalProperties: false
      properties:
        accountId:
          type: string
        balance:
          type: number
        currency:
          type: string
    ProblemDetail:
      type: object
      required: [title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
