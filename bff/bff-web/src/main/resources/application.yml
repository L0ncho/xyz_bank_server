server:
  port: 8081
  ssl:
    enabled: ${BFF_SSL_ENABLED:true}
    key-store: classpath:keystore.p12
    key-store-password: ${BFF_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: xyzbank

spring:
  application:
    name: bff-web

core-service:
  base-url: ${CORE_SERVICE_BASE_URL:http://localhost:8080}
  connect-timeout-ms: 3000
  read-timeout-ms: 3000

xyzbank:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-me-use-32-chars-min}
      issuer: ${JWT_ISSUER:xyz-bank}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{correlationId}] [%15.15t] %-40.40logger{39} : %m%n"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
